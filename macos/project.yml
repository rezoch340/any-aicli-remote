name: AnyAICLIRemoteLauncher
options:
  bundleIdPrefix: com.anyaicliremote
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    ARCHS: arm64
    DEVELOPMENT_TEAM: ""
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ONLY_ACTIVE_ARCH: NO
    OTHER_SWIFT_FLAGS: $(inherited) -file-prefix-map $(PROJECT_DIR)=. -debug-prefix-map $(PROJECT_DIR)=.
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
  configs:
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all

targets:
  AnyAICLIRemoteLauncher:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: AnyAICLIRemoteLauncher
      - path: LauncherCore
      - path: ../apple/Shared
        group: AppleShared
        createIntermediateGroups: false
      - path: Resources/LauncherPolicy.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anyaicliremote.launcher
        PRODUCT_NAME: Any AI CLI Remote Launcher
        PRODUCT_MODULE_NAME: AnyAICLIRemoteLauncher
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Any AI CLI Remote Launcher
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to the local Any AI CLI Remote daemon.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
      configs:
        Release:
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGNING_REQUIRED: YES
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
    postBuildScripts:
      - name: Embed Any AI CLI Remote daemon
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(PROJECT_DIR)/../dist/any-aicli-remote-daemon
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/any-aicli-remote-daemon
        script: |
          set -euo pipefail
          daemon_source="${PROJECT_DIR}/../dist/any-aicli-remote-daemon"
          daemon_directory="${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}"
          daemon_destination="${daemon_directory}/any-aicli-remote-daemon"

          if [[ ! -x "${daemon_source}" ]]; then
            echo "error: missing executable daemon at ${daemon_source}" >&2
            exit 1
          fi

          /bin/mkdir -p "${daemon_directory}"
          /usr/bin/ditto "${daemon_source}" "${daemon_destination}"
          /bin/chmod 0755 "${daemon_destination}"
    scheme:
      gatherCoverageData: false
      testTargets:
        - AnyAICLIRemoteLauncherTests
  AnyAICLIRemoteLauncherTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AnyAICLIRemoteLauncherTests
      - path: LauncherCore
      - path: AnyAICLIRemoteLauncher/LauncherModels.swift
      - path: AnyAICLIRemoteLauncher/LauncherSettings.swift
      - path: AnyAICLIRemoteLauncher/ProductIdentifiers.swift
      - path: AnyAICLIRemoteLauncher/DaemonLocator.swift
      - path: AnyAICLIRemoteLauncher/LauncherLogBuffer.swift
      - path: AnyAICLIRemoteLauncher/LifecycleGeneration.swift
      - path: AnyAICLIRemoteLauncher/RuntimePairing.swift
      - path: AnyAICLIRemoteLauncher/ManagedDaemonProcess.swift
      - path: AnyAICLIRemoteLauncher/PairingSecretStore.swift
      - path: AnyAICLIRemoteLauncher/DaemonControllerError.swift
      - path: ../apple/Shared
        group: AppleShared
        createIntermediateGroups: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anyaicliremote.launcher.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
