name: GrokRemoteLauncher
options:
  bundleIdPrefix: com.grokremote
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    ARCHS: arm64
    DEVELOPMENT_TEAM: ""
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ONLY_ACTIVE_ARCH: NO
    OTHER_SWIFT_FLAGS: $(inherited) -file-prefix-map $(PROJECT_DIR)=. -debug-prefix-map $(PROJECT_DIR)=.
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
  configs:
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all

targets:
  GrokRemoteLauncher:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: GrokRemoteLauncher
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grokremote.launcher
        PRODUCT_NAME: Grok Remote Launcher
        PRODUCT_MODULE_NAME: GrokRemoteLauncher
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Grok Remote Launcher
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to the local Grok Remote daemon.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    postBuildScripts:
      - name: Embed Grok Remote daemon
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(PROJECT_DIR)/../dist/grok-remote-daemon
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Daemon/grok-remote-daemon
        script: |
          set -euo pipefail
          daemon_source="${PROJECT_DIR}/../dist/grok-remote-daemon"
          daemon_directory="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Daemon"
          daemon_destination="${daemon_directory}/grok-remote-daemon"

          if [[ ! -x "${daemon_source}" ]]; then
            echo "error: missing executable daemon at ${daemon_source}" >&2
            exit 1
          fi

          /bin/mkdir -p "${daemon_directory}"
          /usr/bin/ditto "${daemon_source}" "${daemon_destination}"
          /bin/chmod 0755 "${daemon_destination}"
    scheme:
      gatherCoverageData: false
