included:
  - ios
  - apple/Shared
excluded:
  - ios/*.xcodeproj
  - ios/DerivedData
  - DerivedData

strict: true
file_length:
  warning: 600
  error: 600
line_length:
  warning: 160
  error: 160
function_body_length:
  warning: 80
  error: 80
type_body_length:
  warning: 600
  error: 600
cyclomatic_complexity:
  warning: 15
  error: 15
identifier_name:
  min_length:
    warning: 3
    error: 3
  excluded: [id, ID, URL, RPC, HTTP, OS, UI, IP]
