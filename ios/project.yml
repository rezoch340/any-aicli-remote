name: AnyAICLIRemote
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ANY_AI_CLI_REMOTE_PRODUCT_BUNDLE_IDENTIFIER: com.anyaicliremote.app
    ANY_AI_CLI_REMOTE_PRODUCT_DISPLAY_NAME: Any AI CLI Remote
    ANY_AI_CLI_REMOTE_PRODUCT_PAIRING_SCHEME: anyaicliremote
    ANY_AI_CLI_REMOTE_PRODUCT_AUTHORIZATION_HEADER: X-Any-AI-CLI-Remote-Key
    ANY_AI_CLI_REMOTE_PRODUCT_CLIENT_NAME: any-aicli-remote-app-ios
    ANY_AI_CLI_REMOTE_LEGACY_PAIRING_SCHEME: grokremote
    ANY_AI_CLI_REMOTE_LEGACY_AUTHORIZATION_HEADER: X-Grok-Remote-Key
    ANY_AI_CLI_REMOTE_LEGACY_BUNDLE_IDENTIFIER: com.grokremote.app
packages:
  SwiftStreamingMarkdown:
    url: https://github.com/microsoft/SwiftStreamingMarkdown
    revision: c7b12f7b3d77caa188fd1fc056d0f7ce305ef5cd
targets:
  AnyAICLIRemote:
    type: application
    platform: iOS
    productName: Any AI CLI Remote
    sources:
      - AnyAICLIRemote
      - path: ../apple/Shared
        group: AppleShared
    dependencies:
      - package: SwiftStreamingMarkdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ANY_AI_CLI_REMOTE_PRODUCT_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: $(ANY_AI_CLI_REMOTE_PRODUCT_DISPLAY_NAME)
        PRODUCT_MODULE_NAME: AnyAICLIRemote
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AnyAICLIRemote/Info.plist
        CODE_SIGN_ENTITLEMENTS: AnyAICLIRemote/AnyAICLIRemote.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
    scheme:
      testTargets:
        - AnyAICLIRemoteTests
        - AnyAICLIRemoteUITests
  AnyAICLIRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AnyAICLIRemoteTests
    dependencies:
      - target: AnyAICLIRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ANY_AI_CLI_REMOTE_PRODUCT_BUNDLE_IDENTIFIER).tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
  AnyAICLIRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AnyAICLIRemoteUITests
    dependencies:
      - target: AnyAICLIRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ANY_AI_CLI_REMOTE_PRODUCT_BUNDLE_IDENTIFIER).uitests
        TEST_TARGET_NAME: AnyAICLIRemote
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
