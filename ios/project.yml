name: GrokRemote
options:
  bundleIdPrefix: com.grokremote
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  GrokRemote:
    type: application
    platform: iOS
    sources:
      - GrokRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grokremote.app
        PRODUCT_NAME: Grok Remote
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GrokRemote/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
