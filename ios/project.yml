name: GrokRemote
options:
  bundleIdPrefix: icu.lpitiless
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  GrokRemote:
    type: application
    platform: iOS
    sources:
      - GrokRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: icu.lpitiless.grokremote
        PRODUCT_NAME: Grok Remote
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Grok Remote
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 连接局域网中的 grok-remote 服务
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
